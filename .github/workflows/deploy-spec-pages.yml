name: Deploy Specs to Pages

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/deploy-spec-pages.yml"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "specs/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy bundled specs
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate MEDH NSC specs
        run: pnpm --filter @fdsh-utils/spec-medh-nsc lint

      - name: Build Pages artifact
        run: |
          set -euo pipefail
          artifact_dir="${RUNNER_TEMP}/spec-pages"
          rm -rf "${artifact_dir}"
          mkdir -p "${artifact_dir}/schema"

          pnpm --dir specs/medh/nsc exec redocly bundle openapi.yml --output "${artifact_dir}/openapi.yml"
          cp specs/medh/nsc/schemas/*.schema.json "${artifact_dir}/schema/"

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/spec-pages

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
