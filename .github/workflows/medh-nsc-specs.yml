name: MEDH NSC Specs

on:
  pull_request:
    paths:
      - ".github/workflows/medh-nsc-specs.yml"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "specs/medh/nsc/**"

permissions:
  contents: read

jobs:
  lint:
    name: Lint MEDH NSC specs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint specifications
        run: pnpm --filter @fdsh-utils/spec-medh-nsc lint
