name: Bug Report
description: Report a problem with the SDK/library or local dev environment
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug report! Please fill out the sections below as completely as you can.

  - type: dropdown
    id: context
    attributes:
      label: Where does this occur?
      options:
        - Using the SDK/library in a project
        - Using the local dev environment
        - Both
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of the bug.
    validations:
      required: true

  - type: textarea
    id: repro-steps
    attributes:
      label: Steps to Reproduce
      description: Step-by-step instructions to reproduce the behavior.
      placeholder: |
        1. Install/import '...'
        2. Call '...' with these arguments
        3. See error
    validations:
      required: true

  - type: textarea
    id: repro-code
    attributes:
      label: Minimal Reproducible Example
      description: Paste a minimal code snippet that triggers the issue.
      render: shell
    validations:
      required: false

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: Include full error messages or stack traces if available.
    validations:
      required: true

  - type: input
    id: sdk-version
    attributes:
      label: SDK/Library Version
      placeholder: e.g. 2.4.1
    validations:
      required: true

  - type: input
    id: runtime-version
    attributes:
      label: Language/Runtime Version
      placeholder: e.g. Node 20.11, Python 3.11
    validations:
      required: true

  - type: dropdown
    id: install-method
    attributes:
      label: Installed via
      options:
        - npm
        - pip
        - yarn
        - pnpm
        - Source build
        - Other
    validations:
      required: false

  - type: input
    id: os
    attributes:
      label: Operating System
      placeholder: e.g. macOS 14.5, Ubuntu 22.04
    validations:
      required: false

  - type: textarea
    id: dev-env-details
    attributes:
      label: Local Dev Environment Details (if applicable)
      description: How you started it, any config overrides, relevant service logs.
      placeholder: |
        Start command: docker compose up
        Config overrides: .env changes...
        Logs: ...
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Logs / Output
      render: shell
    validations:
      required: false

  - type: textarea
    id: possible-solution
    attributes:
      label: Possible Solution (optional)
    validations:
      required: false

  - type: textarea
    id: additional-context
    attributes:
      label: Additional Context
      description: Related issues, PRs, docs links, etc.
    validations:
      required: false
